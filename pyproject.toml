[project]
name = "fs-communication-intelligence"
version = "0.1.0"
description = "Finishes Solutions communication intelligence platform (email first)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.2",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "packages/ci_core",
    "packages/ci_email",
    "packages/ci_processing",
    "packages/ci_retrieval",
    "packages/ci_testkit",
]

[project.scripts]
ci = "ci_testkit.cli:main"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["packages", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "packages"
packages = ["ci_core", "ci_email", "ci_processing", "ci_retrieval", "ci_testkit"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
addopts = "-ra --strict-markers"
markers = ["db: needs CI_TEST_DATABASE_URL (a throwaway PostgreSQL + pgvector server)"]
