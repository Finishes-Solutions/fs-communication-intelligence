name: CI

# Docs-only changes don't need lint, tests or package builds.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type check, tests
    runs-on: ubuntu-24.04
    # Database tests (tests/db) run against this throwaway server. CI_REQUIRE_DB
    # makes an unreachable server a failure instead of a skip.
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      CI_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install Python and locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format
        run: uv run --frozen ruff format --check .
      - name: Type check
        run: |
          uv run --frozen mypy
          uv run --frozen mypy tests db/run_checks.py db/migrate.py
      - name: Tests
        run: uv run --frozen pytest

  database:
    name: SQL migrations and checks (PostgreSQL 18 + pgvector 0.8.2)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Apply migrations and run checks
        run: python3 db/run_checks.py

  package:
    name: Build Function App packages and import them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: |
          bash scripts/build-function-app.sh ingestion dist
          bash scripts/build-function-app.sh search dist
          bash scripts/build-function-app.sh admin dist
      - name: Import each app with only its packaged dependencies
        run: |
          py="$(uv python find --no-project 3.14 || (uv python install 3.14 >/dev/null && uv python find --no-project 3.14))"
          for app in ingestion search admin; do
            mkdir -p "check/$app" && (cd "check/$app" && unzip -q "../../dist/$app.zip")
          done
          (cd check/ingestion && env -i PATH=/usr/bin:/bin PYTHONPATH=.python_packages/lib/site-packages \
            DEPLOYMENT_ENVIRONMENT=development "$py" -c \
            "import function_app as f; assert {x.get_function_name() for x in f.app.get_functions()} == {'capture', 'process'}")
          (cd check/search && env -i PATH=/usr/bin:/bin PYTHONPATH=.python_packages/lib/site-packages \
            DEPLOYMENT_ENVIRONMENT=development ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000001 \
            SEARCH_PUBLIC_URL=https://example.azurewebsites.net SEARCH_API_CLIENT_ID=x \
            SEARCH_API_APP_ID_URI=api://x AZURE_OPENAI_ENDPOINT=https://aoai.example "$py" -c \
            "import function_app as f; assert type(f.app).__name__ == 'AsgiFunctionApp'")
          (cd check/admin && env -i PATH=/usr/bin:/bin PYTHONPATH=.python_packages/lib/site-packages \
            DEPLOYMENT_ENVIRONMENT=development ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000001 \
            SEARCH_API_CLIENT_ID=x SEARCH_API_APP_ID_URI=api://x ADMIN_SPA_CLIENT_ID=y \
            AZURE_OPENAI_ENDPOINT=https://aoai.example "$py" -c \
            "import function_app as f, ci_admin.api as a; assert type(f.app).__name__ == 'AsgiFunctionApp'; assert (a.STATIC / 'index.html').is_file()")
          (cd check/ingestion && env -i PATH=/usr/bin:/bin PYTHONPATH=.python_packages/lib/site-packages \
            "$py" -P -s -c "import pypdf, openpyxl")
          # Azure Functions puts packages on sys.path, not in PYTHONPATH. The extraction
          # child process must still find pypdf/openpyxl (a blank PDF reads as no_text).
          (cd check/ingestion && env -i PATH=/usr/bin:/bin "$py" -P -s -c "
          import io, sys
          sys.path[:0] = ['.', '.python_packages/lib/site-packages']
          import pypdf
          w = pypdf.PdfWriter(); w.add_blank_page(72, 72); b = io.BytesIO(); w.write(b)
          from ci_processing.extraction import extract
          r = extract('a.pdf', 'application/pdf', b.getvalue(), max_bytes=10**6)
          assert r.status.value == 'no_text', r")
