name: Deploy (development)

# Builds and deploys the dev Function Apps with GitHub OIDC (no stored Azure
# credentials). A push to main deploys only the apps its changes affect
# (scripts/deploy-plan.sh): console-only changes deploy just the admin app,
# shared packages and dependencies deploy all three, and docs, tests, scripts
# and workflow edits deploy nothing. A manual run deploys the app you pick
# (default: all). Database migrations are NOT run here: the dev
# PostgreSQL server only accepts named IPs and Azure services, so apply them with
# `make azure-migrate` (docs/DEPLOY_AZURE.md).
#
# Repository environment "development" needs these secrets (IDs, kept as
# secrets so they are masked in this public repo's logs):
#   AZURE_CLIENT_ID        client id of id-fs-ci-github-dev
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   INGESTION_FUNCTION_APP name of the ingestion Function App
#   SEARCH_FUNCTION_APP    name of the search Function App
#   SEARCH_PUBLIC_URL      https://<search app default host name>
# Optional (the admin console deploys only when both are set):
#   ADMIN_FUNCTION_APP     name of the admin console Function App
#   ADMIN_PUBLIC_URL       https://<admin app default host name>; also written to the
#                          search app's ADMIN_PUBLIC_URL setting, so MCP results link to
#                          the console's read-only email page (/read/<id>)

on:
  workflow_dispatch:
    inputs:
      apps:
        description: Which app(s) to deploy
        type: choice
        options: [all, ingestion, search, admin]
        default: all
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - scripts/build-function-app.sh

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"

jobs:
  plan:
    name: Decide which apps to deploy
    runs-on: ubuntu-24.04
    outputs:
      ingestion: ${{ steps.plan.outputs.ingestion }}
      search: ${{ steps.plan.outputs.search }}
      admin: ${{ steps.plan.outputs.admin }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.apps }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            case "${WANT:-all}" in
              all) changed=ALL ;;
              ingestion) changed=apps/ingestion/manual ;;
              search) changed=apps/search/manual ;;
              admin) changed=apps/admin/manual ;;
            esac
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          else
            changed=ALL  # first push or unknown history: deploy everything
          fi
          printf '%s\n' "$changed" | bash scripts/deploy-plan.sh | tee -a "$GITHUB_OUTPUT"

  deploy:
    name: Build, test, deploy
    needs: plan
    if: needs.plan.outputs.ingestion == 'true' || needs.plan.outputs.search == 'true' || needs.plan.outputs.admin == 'true'
    runs-on: ubuntu-24.04
    environment: development
    env:
      DO_INGESTION: ${{ needs.plan.outputs.ingestion }}
      DO_SEARCH: ${{ needs.plan.outputs.search }}
      DO_ADMIN: ${{ needs.plan.outputs.admin }}
      ADMIN_APP: ${{ secrets.ADMIN_FUNCTION_APP }}
      ADMIN_URL: ${{ secrets.ADMIN_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Unit and contract tests
        run: |
          uv sync --frozen
          uv run --frozen pytest tests/unit tests/contract -q

      - name: Build packages
        run: |
          for app in ingestion search admin; do
            var="DO_${app^^}"
            if [ "${!var}" = true ]; then bash scripts/build-function-app.sh "$app" dist; fi
          done

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ingestion app
        if: env.DO_INGESTION == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.INGESTION_FUNCTION_APP }}
          package: dist/ingestion.zip
          sku: flexconsumption
          remote-build: false

      - name: Link MCP results to the admin console
        if: env.DO_SEARCH == 'true' && env.ADMIN_URL != ''
        env:
          APP: ${{ secrets.SEARCH_FUNCTION_APP }}
        run: |
          # Changing an app setting restarts the app, so only when it differs.
          rg=$(az functionapp list --query "[?name=='$APP'].resourceGroup | [0]" -o tsv)
          current=$(az functionapp config appsettings list -g "$rg" -n "$APP" \
            --query "[?name=='ADMIN_PUBLIC_URL'].value | [0]" -o tsv)
          if [ "$current" = "$ADMIN_URL" ]; then
            echo "ADMIN_PUBLIC_URL already set"
          else
            az functionapp config appsettings set -g "$rg" -n "$APP" -o none \
              --settings "ADMIN_PUBLIC_URL=$ADMIN_URL"
            echo "ADMIN_PUBLIC_URL set"
          fi

      - name: Deploy search app
        if: env.DO_SEARCH == 'true'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.SEARCH_FUNCTION_APP }}
          package: dist/search.zip
          sku: flexconsumption
          remote-build: false

      - name: Deploy admin console
        if: env.DO_ADMIN == 'true' && env.ADMIN_APP != ''
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.ADMIN_FUNCTION_APP }}
          package: dist/admin.zip
          sku: flexconsumption
          remote-build: false

      - name: Smoke test the MCP endpoint
        if: env.DO_SEARCH == 'true'
        env:
          BASE: ${{ secrets.SEARCH_PUBLIC_URL }}
        run: |
          # Without a token the endpoint must refuse (401) and advertise its OAuth metadata.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/mcp" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}') || code=000
            [ "$code" = "401" ] && break
            echo "attempt $attempt: HTTP $code (app may still be starting)"; sleep 20
          done
          [ "$code" = "401" ] || { echo "expected 401 from /mcp without a token, got $code"; exit 1; }
          curl -sf -o /dev/null "$BASE/.well-known/oauth-protected-resource/mcp" && echo "OAuth metadata: ok"

      - name: Smoke test the admin console
        if: env.DO_ADMIN == 'true' && env.ADMIN_URL != ''
        env:
          BASE: ${{ secrets.ADMIN_PUBLIC_URL }}
        run: |
          # The page and its sign-in config are public; every /api call must refuse without a token.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/overview") || code=000
            [ "$code" = "401" ] && break
            echo "attempt $attempt: HTTP $code (app may still be starting)"; sleep 20
          done
          [ "$code" = "401" ] || { echo "expected 401 from /api/overview without a token, got $code"; exit 1; }
          curl -sf "$BASE/" | grep -q 'app.js' && echo "console page: ok"
          curl -sf -o /dev/null "$BASE/config.json" && echo "sign-in config: ok"
