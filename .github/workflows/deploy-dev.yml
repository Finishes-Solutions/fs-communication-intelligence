name: Deploy (development)

# Builds the Function Apps and deploys them to the dev environment with GitHub
# OIDC (no stored Azure credentials). Runs on manual dispatch and on pushes to
# main that touch deployable code. Database migrations are NOT run here: the dev
# PostgreSQL server only accepts named IPs and Azure services, so apply them with
# `make azure-migrate` (docs/DEPLOY_AZURE.md).
#
# Repository environment "development" needs these secrets (IDs, kept as
# secrets so they are masked in this public repo's logs):
#   AZURE_CLIENT_ID        client id of id-fs-ci-github-dev
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   INGESTION_FUNCTION_APP name of the ingestion Function App
#   SEARCH_FUNCTION_APP    name of the search Function App
#   SEARCH_PUBLIC_URL      https://<search app default host name>
# Optional (the admin console deploys only when both are set):
#   ADMIN_FUNCTION_APP     name of the admin console Function App
#   ADMIN_PUBLIC_URL       https://<admin app default host name>

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - scripts/build-function-app.sh
      - .github/workflows/deploy-dev.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"

jobs:
  deploy:
    name: Build, test, deploy
    runs-on: ubuntu-24.04
    environment: development
    env:
      ADMIN_APP: ${{ secrets.ADMIN_FUNCTION_APP }}
      ADMIN_URL: ${{ secrets.ADMIN_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Unit and contract tests
        run: |
          uv sync --frozen
          uv run --frozen pytest tests/unit tests/contract -q

      - name: Build packages
        run: |
          bash scripts/build-function-app.sh ingestion dist
          bash scripts/build-function-app.sh search dist
          bash scripts/build-function-app.sh admin dist

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy ingestion app
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.INGESTION_FUNCTION_APP }}
          package: dist/ingestion.zip
          sku: flexconsumption
          remote-build: false

      - name: Deploy search app
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.SEARCH_FUNCTION_APP }}
          package: dist/search.zip
          sku: flexconsumption
          remote-build: false

      - name: Deploy admin console
        if: env.ADMIN_APP != ''
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.ADMIN_FUNCTION_APP }}
          package: dist/admin.zip
          sku: flexconsumption
          remote-build: false

      - name: Smoke test the MCP endpoint
        env:
          BASE: ${{ secrets.SEARCH_PUBLIC_URL }}
        run: |
          # Without a token the endpoint must refuse (401) and advertise its OAuth metadata.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/mcp" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}') || code=000
            [ "$code" = "401" ] && break
            echo "attempt $attempt: HTTP $code (app may still be starting)"; sleep 20
          done
          [ "$code" = "401" ] || { echo "expected 401 from /mcp without a token, got $code"; exit 1; }
          curl -sf -o /dev/null "$BASE/.well-known/oauth-protected-resource/mcp" && echo "OAuth metadata: ok"

      - name: Smoke test the admin console
        if: env.ADMIN_URL != ''
        env:
          BASE: ${{ secrets.ADMIN_PUBLIC_URL }}
        run: |
          # The page and its sign-in config are public; every /api call must refuse without a token.
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/overview") || code=000
            [ "$code" = "401" ] && break
            echo "attempt $attempt: HTTP $code (app may still be starting)"; sleep 20
          done
          [ "$code" = "401" ] || { echo "expected 401 from /api/overview without a token, got $code"; exit 1; }
          curl -sf "$BASE/" | grep -q 'app.js' && echo "console page: ok"
          curl -sf -o /dev/null "$BASE/config.json" && echo "sign-in config: ok"
